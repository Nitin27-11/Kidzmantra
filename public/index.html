<meta charset="utf-8">
<title>Kidzmantra</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Kidzmantra: an AI learning buddy for kids from Nursery to Class 8. Pick your class, open a chapter and ask any question.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mulish:wght@400;600;700&display=swap">
<style>
:root{
  --paper:#FFFBF2;
  --sheet:#FFFFFF;
  --ink:#1F2A55;
  --ink-soft:#4E5884;
  --line:#E6DFCC;
  --turmeric:#F2B705;
  --marigold:#F2780C;
  --leaf:#2E9C6A;
  --sky:#3B82C4;
  --rose:#D9466F;
  --chip-ink:#1F2A55;
  --shadow:0 1px 0 rgba(31,42,85,.06),0 6px 18px -8px rgba(31,42,85,.22);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Mulish",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141A33;--sheet:#1C2444;--ink:#F3EEDD;--ink-soft:#B9BEDA;--line:#2E3760;
  --turmeric:#F5C53A;--marigold:#FF944A;--leaf:#4CC48E;--sky:#6AAEEA;--rose:#F2789A;--chip-ink:#141A33;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141A33;--sheet:#1C2444;--ink:#F3EEDD;--ink-soft:#B9BEDA;--line:#2E3760;
  --turmeric:#F5C53A;--marigold:#FF944A;--leaf:#4CC48E;--sky:#6AAEEA;--rose:#F2789A;--chip-ink:#141A33;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--marigold)}
.lede{color:var(--ink-soft);max-width:60ch;margin:0}
.t-y{background:var(--turmeric)}.t-o{background:var(--marigold)}.t-g{background:var(--leaf)}.t-b{background:var(--sky)}.t-r{background:var(--rose)}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px dashed var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:1.6rem;text-decoration:none;letter-spacing:-.01em}
.logo span:nth-child(1){color:var(--marigold)}
.logo span:nth-child(2){color:var(--leaf)}
.logo small{font-family:var(--body);font-size:.7rem;font-weight:700;color:var(--ink-soft);margin-left:6px;letter-spacing:.06em;text-transform:uppercase}
.jump{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;color:var(--ink-soft)}
select,textarea,input{font:inherit;color:var(--ink);background:var(--sheet);border:2px solid var(--line);border-radius:10px}
select{padding:6px 10px;font-weight:700}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-family:var(--body);font-size:1rem;padding:11px 20px;border-radius:999px;text-decoration:none;border:2px solid var(--ink);cursor:pointer}
.btn-main{background:var(--ink);color:var(--paper)}
.btn-main:hover{background:var(--marigold);border-color:var(--marigold);color:#fff}
.btn-main:disabled{opacity:.55;cursor:wait}
.btn-ghost{background:transparent;color:var(--ink)}
.btn-ghost:hover{background:var(--sheet)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--ink);font-family:var(--body);text-decoration:none}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"],.chip[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start;padding-block:44px 48px}
.hero > *{min-width:0}
.hero h1{font-size:clamp(2.2rem,5.5vw,3.5rem);font-weight:800;margin-block:8px 14px}
.hero h1 em{font-style:normal;color:var(--marigold);background:linear-gradient(transparent 62%,color-mix(in srgb,var(--turmeric) 45%,transparent) 62%)}
.trust{display:flex;gap:20px;flex-wrap:wrap;margin-top:22px;font-size:.88rem;color:var(--ink-soft);font-weight:600}
.trust b{color:var(--ink);font-family:var(--display);font-size:1.15rem}

/* ask panel */
.panel{background:var(--sheet);border-radius:12px;box-shadow:var(--shadow);padding:20px;display:grid;gap:14px;position:relative}
.panel.taped::before{content:"";position:absolute;top:-12px;left:50%;width:90px;height:24px;transform:translateX(-50%) rotate(-2deg);background:color-mix(in srgb,var(--turmeric) 55%,transparent);border-radius:2px}
.panel h3{font-size:1.3rem}
.ask{display:grid;gap:10px}
.ask textarea{width:100%;min-height:76px;padding:12px;resize:vertical;line-height:1.5}
.ask textarea:focus{border-color:var(--sky);outline:none}
.ask-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hint{font-size:.8rem;color:var(--ink-soft)}

.thread{display:grid;gap:12px;max-height:520px;overflow:auto;scroll-behavior:smooth}
.thread:empty{display:none}
.msg{padding:12px 14px;border-radius:12px;max-width:92%;overflow-wrap:anywhere}
.msg p{margin:0 0 8px}.msg p:last-child{margin:0}
.msg ul,.msg ol{margin:0 0 8px;padding-left:20px}
.msg.me{justify-self:end;background:var(--ink);color:var(--paper);border-bottom-right-radius:4px}
.msg.bot{justify-self:start;background:var(--paper);border:2px solid var(--line);border-bottom-left-radius:4px}
.msg.bot::before{content:"Mantra Buddy";display:block;font-family:var(--display);font-weight:800;font-size:.85rem;color:var(--leaf);margin-bottom:2px}
.msg.note{justify-self:stretch;max-width:none;background:color-mix(in srgb,var(--turmeric) 18%,var(--sheet));border:2px dashed var(--turmeric);font-size:.92rem}
.voice-panel{display:grid;gap:8px;padding:10px 12px;border:2px dashed var(--line);border-radius:12px}
.voice-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.voice-bar[hidden]{display:none}
.voice-panel .hint{min-width:118px;font-weight:700}
.chip.sm{padding:4px 12px;font-size:.8rem}
.listen-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.say{border:2px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:3px 12px;font:inherit;font-size:.8rem;font-weight:700;cursor:pointer}
.say:hover,.say[aria-pressed="true"]{border-color:var(--ink)}
.say:disabled{opacity:.6;cursor:wait}
.btn.listening{background:var(--rose);border-color:var(--rose);color:#fff}
/* read-along: the paragraph being read glows, the word being spoken pops */
.msg .body p,.msg .body li,.book p,.book li,.book h2{border-radius:8px;transition:background .3s,box-shadow .3s}
.msg .body .reading,.book .reading{background:color-mix(in srgb,var(--sky) 16%,transparent);box-shadow:-4px 0 0 var(--sky)}
.w{display:inline-block;border-radius:5px;padding:0 1px;transition:opacity .3s,background .15s}
.w.said{opacity:.7}
.w.now{background:var(--turmeric);color:#141A33;opacity:1}
@media (prefers-reduced-motion:no-preference){
  .msg .body .reading,.book .reading{animation:glow 1.6s ease-in-out infinite alternate}
  .w.now{animation:pop .35s ease-out both}
}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28) translateY(-3px)}100%{transform:scale(1.1)}}
@keyframes glow{from{box-shadow:-4px 0 0 var(--sky)}to{box-shadow:-4px 0 0 var(--sky),0 0 14px color-mix(in srgb,var(--sky) 45%,transparent)}}
.sources{margin-top:8px;font-size:.78rem;color:var(--ink-soft)}
.sources a{color:var(--sky);font-weight:700}
.msg.note code{font-size:.85em;background:var(--sheet);padding:1px 5px;border-radius:4px}
.typing span{display:inline-block;width:8px;height:8px;margin-right:4px;border-radius:50%;background:var(--ink-soft)}
@media (prefers-reduced-motion:no-preference){
  .typing span{animation:bob 1s infinite ease-in-out}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes bob{50%{transform:translateY(-5px);opacity:.5}}
}

section{padding-block:48px}
.ruled{background-image:repeating-linear-gradient(var(--paper) 0 31px,var(--line) 31px 32px)}
.head{display:grid;gap:8px;margin-bottom:24px}

/* grade cards */
.grades{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
.grade{background:var(--sheet);border-radius:10px;box-shadow:var(--shadow);text-decoration:none;display:flex;flex-direction:column;overflow:hidden}
.grade .face{font-family:var(--display);font-weight:800;font-size:2.2rem;color:var(--chip-ink);padding:18px 16px 10px;line-height:1}
.grade .face.long{font-size:1.75rem;padding-top:22px}
.grade .info{padding:10px 16px 14px;display:grid;gap:2px}
.grade b{font-family:var(--display);font-size:1.2rem}
.grade span{font-size:.82rem;color:var(--ink-soft);font-weight:600;line-height:1.35}
.grade .age{white-space:nowrap;color:var(--ink);font-weight:700}

/* search */
.search{width:100%;padding:12px 14px;font-size:1rem}
.search:focus{border-color:var(--sky);outline:none}
.results{display:grid;gap:8px;margin-top:14px}
.results:empty{display:none}

/* chapter list */
.crumbs{font-size:.88rem;font-weight:700;color:var(--ink-soft);display:flex;gap:6px;flex-wrap:wrap;padding-top:24px}
.crumbs a{text-decoration:none;color:var(--sky)}
.crumbs a:hover{text-decoration:underline}
.page-head{display:grid;gap:10px;padding-block:14px 22px}
.page-head h1{font-size:clamp(2rem,5vw,3rem);font-weight:800}
.subjects{margin-bottom:22px}
.chapters{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.chapter{display:flex;align-items:center;gap:14px;background:var(--sheet);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;text-decoration:none;min-height:64px}
.chapter .num{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--chip-ink)}
.chapter .ttl{font-weight:700;line-height:1.3}
.chapter .sub{display:block;font-size:.78rem;color:var(--ink-soft);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .grade,.chapter{transition:transform .18s ease}
  .grade:hover,.chapter:hover{transform:translateY(-3px) rotate(-.4deg)}
}

/* chapter page */
/* chapter ebook */
.book{gap:6px}
.book-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.book-sec{display:grid;gap:10px;padding:14px 0;border-top:2px dashed var(--line)}
.book-sec:first-of-type{border-top:0}
.book-sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.book-sec h2{font-size:1.45rem;color:var(--leaf)}
.book p{margin:0;line-height:1.7}
.book ul,.book ol{margin:0;padding-left:22px;display:grid;gap:6px;line-height:1.6}
.book-box{background:color-mix(in srgb,var(--turmeric) 16%,var(--sheet));border:2px solid color-mix(in srgb,var(--turmeric) 60%,transparent);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.book-q{border:2px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;gap:6px}
.book-q summary{cursor:pointer;font-weight:700;color:var(--sky);font-size:.9rem}
.book-q .ans{margin-top:6px;font-weight:700;color:var(--leaf)}
.book-quiz{display:grid;gap:12px;counter-reset:qz}
.qz{border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px;counter-increment:qz;transition:border-color .2s,background .2s}
.qz-q{font-weight:700}
.qz-q::before{content:counter(qz) ". "}
.qz-opts{display:flex;flex-wrap:wrap;gap:8px}
.qz-opt,.qz-check,.qz-again{border:2px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}
.qz-opt:hover:not(:disabled),.qz-check:hover{border-color:var(--sky)}
.qz-opt:disabled{cursor:default}
.qz-opt.right{background:var(--leaf);border-color:var(--leaf);color:#141A33}
.qz-opt.wrong{background:var(--rose);border-color:var(--rose);color:#fff}
.qz.done-right{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 10%,transparent)}
.qz.done-wrong{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 8%,transparent)}
.qz-fill{display:flex;gap:8px;flex-wrap:wrap}
.qz-fill input{padding:6px 12px;min-width:160px;flex:1;max-width:280px}
.qz-why{font-size:.92rem;color:var(--ink-soft)}
.qz-score{border-radius:14px;padding:14px;text-align:center;font-weight:800;font-family:var(--display);font-size:1.2rem;background:color-mix(in srgb,var(--turmeric) 18%,var(--sheet));display:grid;gap:8px;justify-items:center}
.qz-stars{font-size:2rem;letter-spacing:4px}
.qz-party{font-size:2.4rem}
@media (prefers-reduced-motion:no-preference){.qz-party{animation:party .9s ease-out both}}
@keyframes party{0%{transform:scale(.2) rotate(-20deg);opacity:0}60%{transform:scale(1.3) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.side .stars{margin-left:4px;font-size:.8rem}
.book.young{font-size:1.18rem}
.book.young h2{font-size:1.6rem}
.book-empty{color:var(--ink-soft)}
.chap-grid{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start;padding-bottom:48px}
.chap-grid > *{min-width:0}
.side{display:grid;gap:16px}
.side .panel{gap:10px}
.side ol{margin:0;padding-left:20px;font-size:.92rem;display:grid;gap:4px}
.side ol a{text-decoration:none;color:var(--ink-soft)}
.side ol a:hover{color:var(--ink);text-decoration:underline}
.side ol a[aria-current="page"]{color:var(--marigold);font-weight:700}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}

/* how */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;counter-reset:s}
.step{display:grid;gap:6px}
.step::before{counter-increment:s;content:counter(s);font-family:var(--display);font-weight:800;font-size:1.4rem;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--turmeric);color:var(--chip-ink)}
.step h3{font-size:1.2rem}
.step p{margin:0;color:var(--ink-soft);font-size:.95rem}

footer{border-top:2px dashed var(--line);padding-block:28px;color:var(--ink-soft);font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding-block:28px 36px}
  .chap-grid{grid-template-columns:1fr}
}
</style>

<header>
  <div class="wrap nav">
    <a class="logo" href="#/" aria-label="Kidzmantra home"><span>Kidz</span><span>mantra</span><small>AI</small></a>
    <label class="jump">Go to
      <select id="jump" aria-label="Go to class"></select>
    </label>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <div>© 2026 Kidzmantra · An AI learning buddy for Nursery to Class 8</div>
    <div>Answers are made by AI. Check important facts with a teacher or parent.</div>
  </div>
</footer>

<script>

   server.py answers at this path. The page sends:
     POST { question, grade, subject, chapter, history:[{role,text}] }
   and gets back:
     { answer: "text", sources:[{url,title}] }  or  { error: "message" } */
const AI_ENDPOINT = "/api/ask";
const TRANSLATE_ENDPOINT = "/api/translate";
const SPEAK_ENDPOINT = "/api/speak";

  maths:"Numbers 1 to 10|Counting with fingers|Shapes: circle, square, triangle|Big and small|Matching and sorting",
  world:"Parts of my body|My family|Colours around us|Pet animals|Fruits|Vehicles|Good manners",

 {id:"class-3",n:"Class 3",face:"3",age:"Ages 8–9",c:"t-y",s:{

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* turn plain AI text into simple safe HTML: paragraphs, bullet/number lists, **bold** */
function fmt(t){
  const out=[];let list=null;
  for(const raw of esc(t).split(/\n/)){
    const line=raw.trim().replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
    const ul=line.match(/^[-*•]\s+(.*)/),ol=line.match(/^\d+[.)]\s+(.*)/);
    const kind=ul?"ul":ol?"ol":null;
    if(kind){if(!list||list.k!==kind){list={k:kind,items:[]};out.push(list)}list.items.push((ul||ol)[1]);continue}
    list=null;if(line)out.push(`<p>${line}</p>`);
  }
  return out.map(x=>typeof x==="string"?x:`<${x.k}>${x.items.map(i=>`<li>${i}</li>`).join("")}</${x.k}>`).join("");
}

const Recog=window.SpeechRecognition||window.webkitSpeechRecognition;
const BASE_RATE=.8; // backup voice: "1x" is a little slower than normal speech so children can follow
const EMOJI=/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\uFE0F]/gu;
let tutorVoice=true; // turned off if the server has no voice set up
const TUTOR_RATE=.9; // tutor voice at "1x" plays a little slower than normal, for children
const player=new Audio();
player.preservesPitch=true;
// Safari only lets a page play sound it starts during a tap, so wake the player on the first tap.
const unlockPlayer=()=>{player.src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=";player.play().catch(()=>{})};

const DEVA=/[ऀ-ॿ]/;
const langOf=t=>(t.match(/[ऀ-ॿ]/g)||[]).length>(t.match(/[A-Za-z]/g)||[]).length*.5?"hi":"en";
if(TTS)speechSynthesis.getVoices(); // voices load in the background

function pickVoice(code){
  const want=code==="hi"?["hi"]:["en-in","en-gb","en-us","en"];
  const vs=TTS?speechSynthesis.getVoices():[];
  for(const w of want){
    const m=vs.filter(v=>v.lang.replace("_","-").toLowerCase().startsWith(w));
    // Voices on the device report each word as it is spoken, which drives the highlight.
    if(m.length)return m.find(v=>v.localService)||m[0];
  }
  return null;
}

// Wrap every word of an answer in a span, remembering where each word sits in its
// paragraph so the highlight can follow the voice.
function prepareReading(body){
  return [...body.querySelectorAll("h2,p,li")].filter(el=>!el.closest("details,.qz,.qz-score")).map(block=>{
    const words=[],nodes=[],walker=document.createTreeWalker(block,NodeFilter.SHOW_TEXT);
    let text="";
    while(walker.nextNode())nodes.push(walker.currentNode);
    for(const n of nodes){
      const frag=document.createDocumentFragment();
      for(const part of n.nodeValue.split(/(\s+)/)){
        if(!part)continue;
        if(/^\s+$/.test(part)){frag.appendChild(document.createTextNode(part));text+=part;continue}
        const span=document.createElement("span");
        span.className="w";span.textContent=part;
        words.push({el:span,start:text.length,end:text.length+part.length});
        text+=part;frag.appendChild(span);
      }
      n.replaceWith(frag);
    }
    return {block,words,text};
  });
}

// Split a paragraph into sentences, and each sentence into Hindi and English runs,
// so every piece is spoken by a voice of the right language.
function piecesOf(r){
  const out=[],spoken=r.text.replace(EMOJI,m=>" ".repeat(m.length));
  const sentence=/[^.!?।\n]+[.!?।]*/g;let s;
  while((s=sentence.exec(spoken))){
    const run=/[ऀ-ॿ][ऀ-ॿ\s,;:'"()0-9-]*|[^ऀ-ॿ]+/g;let m;
    while((m=run.exec(s[0])))
      if(/[\p{L}\p{N}]/u.test(m[0]))out.push({text:m[0],at:s.index+m.index,code:DEVA.test(m[0])?"hi":"en"});
  }
  return out;
}

const reader={session:0,queue:[],i:0,u:null,timer:null,raf:0,onDone:null};
function clearMarks(){
  document.querySelectorAll(".w.now").forEach(e=>e.classList.remove("now"));
  document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));
}
function stopSpeaking(){
  const d=reader.onDone;
  reader.session++;reader.onDone=null;reader.queue=[];reader.u=null;
  clearTimeout(reader.timer);cancelAnimationFrame(reader.raf);
  player.pause();
  if(TTS)speechSynthesis.cancel();
  clearMarks();
  if(d)d();
}
function markWord(r,pos){
  const k=r.words.findIndex(w=>pos<w.end);
  if(k<0||r.words[k].el.classList.contains("now"))return;
  r.block.querySelectorAll(".w.now").forEach(e=>e.classList.remove("now"));
  for(let j=0;j<k;j++)r.words[j].el.classList.add("said");
  r.words[k].el.classList.add("now");
}
// Highlight the paragraph and word at this point (0 to 1) of a piece of tutor audio. The voice
// doesn't report word timings, so the place is worked out from the share of letters read.
function markAt(c,frac){
  let target=frac*c.total;
  for(const r of c.blocks){
    const weight=r.text.length+12; // a little extra for the pause after each paragraph
    if(target<weight||r===c.blocks[c.blocks.length-1]){
      if(!r.block.classList.contains("reading")){
        clearMarks();r.block.classList.add("reading");
        r.block.scrollIntoView({block:"nearest",behavior:"smooth"});
      }
      markWord(r,Math.min(r.text.length-1,Math.floor(target/weight*r.text.length)));
      return;
    }
    target-=weight;
  }
}
// The first paragraph is voiced on its own so speaking starts quickly; the rest in bigger pieces.
function chunkBlocks(blocks){
  const out=[];let cur=null;
  blocks.forEach((r,i)=>{
    if(!cur||i===1||cur.len+r.text.length>500){cur={blocks:[],len:0};out.push(cur)}
    cur.blocks.push(r);cur.len+=r.text.length;
  });
  for(const c of out){
    c.text=c.blocks.map(r=>r.text.replace(EMOJI,"")).join("\n");
    c.total=c.blocks.reduce((a,r)=>a+r.text.length+12,0);
  }
  return out;
}
const voiceCache=new Map();
function fetchVoice(text){
  if(!voiceCache.has(text)){
    const p=fetch(SPEAK_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})})
      .then(r=>{if(r.status===501)tutorVoice=false;if(!r.ok)throw new Error("voice "+r.status);return r.blob()})
      .then(b=>URL.createObjectURL(b));
    p.catch(()=>voiceCache.delete(text));
    voiceCache.set(text,p);
  }
  return voiceCache.get(text);
}
function readAloud(blocks,onDone,onPlay){
  stopSpeaking();
  blocks.forEach(r=>r.words.forEach(w=>w.el.classList.remove("said","now")));
  reader.onDone=onDone||null;
  const session=reader.session,live=()=>reader.session===session;
  if(!tutorVoice){if(onPlay)onPlay();browserRead(blocks);return}
  const chunks=chunkBlocks(blocks),audio=chunks.map(c=>fetchVoice(c.text));
  audio.forEach(p=>p.catch(()=>{}));
  const fallback=n=>{if(live()){if(onPlay)onPlay();browserRead(chunks.slice(n).flatMap(c=>c.blocks))}};
  const play=async n=>{
    if(!live())return;
    if(n>=chunks.length){finishReading();return}
    let url;
    try{url=await audio[n]}catch(e){fallback(n);return}
    if(!live())return;
    const c=chunks[n];
    player.src=url;
    player.defaultPlaybackRate=player.playbackRate=TUTOR_RATE*VOICE.speed;
    const follow=()=>{
      if(!live())return;
      if(player.duration&&isFinite(player.duration))markAt(c,player.currentTime/player.duration);
      reader.raf=requestAnimationFrame(follow);
    };
    player.onplaying=()=>{if(live()){if(n===0&&onPlay)onPlay();cancelAnimationFrame(reader.raf);follow()}};
    player.onended=()=>{if(live()){cancelAnimationFrame(reader.raf);play(n+1)}};
    player.onerror=()=>fallback(n);
    player.play().catch(()=>fallback(n));
  };
  play(0);
}
function finishReading(){
  const d=reader.onDone;
  reader.onDone=null;reader.u=null;cancelAnimationFrame(reader.raf);clearMarks();
  if(d)d();
}
// Backup: the browser's own voice, one sentence at a time, so speed changes and Stop work straight away.
function browserRead(blocks){
  if(!TTS){finishReading();return}
  reader.queue=blocks.flatMap(r=>piecesOf(r).map(p=>({...p,r})));
  reader.i=0;
  speakNext();
}
function speakNext(){
  clearTimeout(reader.timer);
  const p=reader.queue[reader.i++];
  if(!p){finishReading();return}
  document.querySelectorAll(".reading").forEach(e=>{if(e!==p.r.block)e.classList.remove("reading")});
  p.r.block.classList.add("reading");
  p.r.block.scrollIntoView({block:"nearest",behavior:"smooth"});
  const u=new SpeechSynthesisUtterance(p.text),v=pickVoice(p.code);
  if(v)u.voice=v;
  u.lang=v?v.lang:(p.code==="hi"?"hi-IN":"en-IN");
  u.rate=BASE_RATE*VOICE.speed;
  let boundaries=false;
  u.onstart=()=>{
    markWord(p.r,p.at);
    // Some voices never report words; then move the highlight along at an estimated pace.
    const t0=Date.now(),msPerChar=1000/(14*u.rate);
    const tick=()=>{
      if(boundaries||reader.u!==u)return;
      markWord(p.r,Math.min(p.at+p.text.length-1,p.at+Math.floor((Date.now()-t0)/msPerChar)));
      reader.timer=setTimeout(tick,120);
    };
    reader.timer=setTimeout(tick,400);
  };
  u.onboundary=e=>{if(e.name&&e.name!=="word")return;boundaries=true;markWord(p.r,p.at+e.charIndex)};
  u.onend=()=>{if(reader.u===u)speakNext()};
  u.onerror=e=>{if(reader.u===u&&e.error!=="interrupted"&&e.error!=="canceled")speakNext()};
  reader.u=u;
  speechSynthesis.speak(u);
}

async function translateAI(text,to){
  const r=await fetch(TRANSLATE_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,to})});
  let j={};try{j=await r.json()}catch(e){}

// "🔊 English" and "🔊 हिंदी" under an answer. Picking the other language translates the
// answer first, shows the translation, and reads it.
function addListenButtons(msg,ans){
  if(!TTS&&!tutorVoice)return null;
  const body=msg.querySelector(".body"),texts={[langOf(ans)]:ans},btns={};
  const label={en:"🔊 English",hi:"🔊 हिंदी"};
  let shown=langOf(ans),blocks=prepareReading(body);
  const row=document.createElement("div");
  row.className="listen-row";
  const idle=()=>{for(const k in btns){btns[k].textContent=label[k];btns[k].setAttribute("aria-pressed","false")}};
  for(const code of ["en","hi"]){
    const b=document.createElement("button");
    b.type="button";b.className="say";btns[code]=b;row.appendChild(b);
    b.addEventListener("click",async()=>{
      if(b.getAttribute("aria-pressed")==="true"){stopSpeaking();return}
      stopSpeaking();
      if(!texts[code]){
        b.textContent=code==="hi"?"⏳ हिंदी में बदल रहे हैं…":"⏳ Translating…";b.disabled=true;
        try{texts[code]=await translateAI(texts[shown],code)}
        catch(e){b.disabled=false;idle();b.textContent="⚠️ Try again";return}
        b.disabled=false;
      }
      if(shown!==code){shown=code;body.innerHTML=fmt(texts[code]);body.lang=code;blocks=prepareReading(body)}
      idle();
      b.textContent=code==="hi"?"⏳ आवाज़ आ रही है…":"⏳ Getting the voice…";b.setAttribute("aria-pressed","true");
      readAloud(blocks,idle,()=>{b.textContent="⏹ Stop"});
    });
  }
  idle();
  msg.appendChild(row);
  return btns;
}

function bindChat(getCtx){
  const thread=document.getElementById("thread"),form=document.getElementById("askForm"),
        q=document.getElementById("q"),btn=document.getElementById("askBtn"),history=[];
  const add=(cls,html)=>{const d=document.createElement("div");d.className="msg "+cls;d.innerHTML=html;thread.appendChild(d);thread.scrollTop=thread.scrollHeight;return d};
  async function send(text){
    text=text.trim();if(!text)return;
    add("me",fmt(text));q.value="";
    if(!AI_ENDPOINT){
      add("note",`<p><b>The AI is not connected yet.</b> Once a backend is added in <code>AI_ENDPOINT</code> at the bottom of this page, Mantra Buddy will answer here for ${esc(getCtx().grade)}.</p>`);
      return;
    }
    btn.disabled=true;
    const wait=add("bot",'<span class="typing" aria-label="Thinking"><span></span><span></span><span></span></span>');
    try{
      const res=await askAI(text,getCtx(),history.slice(-8));
      const ans=res.answer||"Hmm, I could not think of an answer. Try asking in a different way?";
      wait.innerHTML=`<div class="body">${fmt(ans)}</div>`+sourcesHTML(res.sources);
      const listen=addListenButtons(wait,ans);
      if(listen&&VOICE.auto)listen[VOICE.answer].click();
      history.push({role:"user",text},{role:"assistant",text:ans});
    }catch(e){
      wait.className="msg note";
      wait.innerHTML=`<p>${esc(e.message&&!/^Failed to fetch|^Server said/.test(e.message)?e.message:"Oops, Mantra Buddy could not answer right now. Please try again in a moment.")}</p>`;
    }finally{btn.disabled=false;thread.scrollTop=thread.scrollHeight}
  }
  form.addEventListener("submit",e=>{e.preventDefault();send(q.value)});

  // Voice settings: answer language, voice-question language, speed, read aloud on/off.
  const opts=document.querySelectorAll(".voice-panel [data-set]"),auto=document.getElementById("autoSpeak"),
        mic=document.getElementById("micBtn"),placeholder0=q.placeholder;
  const showVoice=()=>{
    opts.forEach(b=>b.setAttribute("aria-pressed",String(String(VOICE[b.dataset.set])===b.dataset.val)));
    auto.textContent=VOICE.auto?"🔊 Read answers aloud: On":"🔇 Read answers aloud: Off";
    auto.setAttribute("aria-pressed",String(VOICE.auto));
    q.placeholder=VOICE.answer==="hi"?"अपना सवाल यहाँ लिखो…":placeholder0;
  };
  opts.forEach(b=>b.addEventListener("click",()=>{
    VOICE[b.dataset.set]=b.dataset.set==="speed"?+b.dataset.val:b.dataset.val;
    if(b.dataset.set==="speed")player.playbackRate=TUTOR_RATE*VOICE.speed;
    saveVoice();showVoice();
  }));
  document.getElementById("speedRow").hidden=false;
  {
    auto.addEventListener("click",()=>{VOICE.auto=!VOICE.auto;saveVoice();if(!VOICE.auto)stopSpeaking();showVoice()});
  }
  showVoice();

  // Ask by speaking: listens in the chosen language, then asks what it heard.
  let recog=null;
  if(Recog){
    mic.hidden=false;
    document.getElementById("askLangRow").hidden=false;
    mic.addEventListener("click",()=>{
      if(recog){recog.stop();return}
      stopSpeaking();
      recog=new Recog();
      recog.lang=VOICE.ask==="hi"?"hi-IN":"en-IN";
      recog.interimResults=true;
      let heard="",failed=false;
      recog.onresult=e=>{heard=Array.from(e.results,r=>r[0].transcript).join("");q.value=heard};
      recog.onerror=e=>{
        failed=true;
        if(e.error==="not-allowed"||e.error==="service-not-allowed")
          add("note","<p>Mantra Buddy can't hear you. Please allow the microphone for this site in your browser, then press Speak again.</p>");
        else if(e.error==="no-speech")add("note","<p>I didn't hear anything. Press Speak and try again!</p>");
      };
      recog.onend=()=>{
        recog=null;mic.classList.remove("listening");mic.textContent="🎤 Speak";
        if(!failed&&heard.trim())send(heard);
      };
      mic.classList.add("listening");mic.textContent="⏹ Stop listening";
      recog.start();
    });
  }
  q.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(q.value)}});
  document.querySelectorAll("#starters .chip").forEach(c=>c.addEventListener("click",()=>send(c.textContent)));
}

/* ---------- chapter ebooks: public/books/<class>/<subject>.txt, one "@@ <n>" block per chapter.
   ## heading · > box · - list · 1. list · Q: / A: quiz · **bold** ---------- */
const bookCache=new Map();
function loadBook(gid,k){
  const url=`books/${gid}/${k}.txt`;
  if(!bookCache.has(url))bookCache.set(url,fetch(url).then(r=>{if(!r.ok)throw new Error("no book");return r.text()}).then(t=>{
    const ch={};let n=null;
    for(const line of t.split(/\r?\n/)){
      const m=line.match(/^@@\s*(\d+)\s*$/);
      if(m){n=+m[1];ch[n]=[];continue}
      if(n!==null)ch[n].push(line);
    }
    return ch;
  }).catch(e=>{bookCache.delete(url);throw e}));
  return bookCache.get(url);
}
function bookHTML(lines){
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  const secs=[];let sec=null,list=null,box=null,q=null;
  const flush=()=>{list=null;box=null};
  const body=()=>{if(!sec){sec={title:"",html:[]};secs.push(sec)}return sec.html};
  for(const raw of lines){
    const line=raw.trim();
    if(!line){flush();continue}
    let m;
    if((m=line.match(/^##\s+(.*)/))){flush();q=null;sec={title:m[1],html:[]};secs.push(sec);continue}
    if((m=line.match(/^(MCQ|TF|FILL):\s*(.*)/))){flush();q=null;body().push({quiz:m[1],raw:m[2]});continue}
    if((m=line.match(/^Q:\s*(.*)/))){flush();q={q:m[1],a:""};body().push(q);continue}
    if((m=line.match(/^A:\s*(.*)/))&&q){q.a=m[1];q=null;continue}
    if((m=line.match(/^>\s*(.*)/))){list=null;if(!box){box={box:[]};body().push(box)}box.box.push(m[1]);continue}
    const ul=line.match(/^[-•]\s+(.*)/),ol=line.match(/^\d+[.)]\s+(.*)/);
    if(ul||ol){box=null;const kind=ul?"ul":"ol";if(!list||list.kind!==kind){list={kind,items:[]};body().push(list)}list.items.push((ul||ol)[1]);continue}
    flush();body().push(`<p>${inline(line)}</p>`);
  }
  // MCQ: question | option | *right option | option || why
  // TF: statement | true/false || why      FILL: sentence with ___ | answer;also-ok || why
  const quiz=x=>{
    const [main,why=""]=x.raw.split("||").map(t=>t.trim());
    const [question,...rest]=main.split("|").map(t=>t.trim());
    let inner;
    if(x.quiz==="MCQ")inner=`<div class="qz-opts">${rest.map(o=>`<button type="button" class="qz-opt" data-ok="${o.startsWith("*")?1:0}">${inline(o.replace(/^\*/,""))}</button>`).join("")}</div>`;
    else if(x.quiz==="TF"){const t=/^t/i.test(rest[0]||"");inner=`<div class="qz-opts"><button type="button" class="qz-opt" data-ok="${t?1:0}">✅ True</button><button type="button" class="qz-opt" data-ok="${t?0:1}">❌ False</button></div>`}
    else inner=`<div class="qz-fill"><input type="text" autocomplete="off" aria-label="Your answer" data-answers="${esc(rest[0]||"")}"><button type="button" class="qz-check">Check</button></div>`;
    return `<div class="qz">${`<p class="qz-q">${inline(question)}</p>`}${inner}${why?`<p class="qz-why" hidden>💡 ${inline(why)}</p>`:""}</div>`;
  };
  const group=html=>{const out=[];for(const x of html){if(x&&x.quiz){const last=out[out.length-1];if(last&&last.qs)last.qs.push(x);else out.push({qs:[x]})}else out.push(x)}return out};
  const part=x=>typeof x==="string"?x
    :x.qs?`<div class="book-quiz">${x.qs.map(quiz).join("")}<div class="qz-score" hidden></div></div>`
    :x.box?`<div class="book-box">${x.box.map(t=>`<p>${inline(t)}</p>`).join("")}</div>`
    :x.items?`<${x.kind}>${x.items.map(t=>`<li>${inline(t)}</li>`).join("")}</${x.kind}>`
    :`<div class="book-q"><p>${inline(x.q)}</p>${x.a?`<details><summary>Show answer</summary><p class="ans">${inline(x.a)}</p></details>`:""}</div>`;
  return secs.map(s=>`<section class="book-sec">
    <div class="book-sec-head">${s.title?`<h2>${inline(s.title)}</h2>`:"<span></span>"}<button type="button" class="say" hidden>🔊 Listen</button></div>
    <div class="book-body">${group(s.html).map(part).join("")}</div></section>`).join("");
}
// Stars a child earned on a chapter's quiz (best score), kept on this device.
const starsKey=id=>"km-stars:"+id;
function getStars(id){try{return +localStorage.getItem(starsKey(id))||0}catch(e){return 0}}
function saveStars(id,n){try{if(n>getStars(id))localStorage.setItem(starsKey(id),n)}catch(e){}}
const normAns=t=>t.toLowerCase().normalize("NFC").replace(/[\s.,!?'"।:;()-]/g,"");
function bindQuiz(qb,id){
  const items=[...qb.querySelectorAll(".qz")],score=qb.querySelector(".qz-score");
  let right=0,answered=0;
  const finish=(qz,ok)=>{
    qz.classList.add(ok?"done-right":"done-wrong");
    const why=qz.querySelector(".qz-why");if(why)why.hidden=false;
    answered++;if(ok)right++;
    if(answered<items.length)return;
    const pct=right/items.length,stars=pct>=.9?3:pct>=.6?2:1;
    saveStars(id,stars);
    score.hidden=false;
    score.innerHTML=`${pct===1?'<div class="qz-party">🎉</div>':""}<div>You got ${right} out of ${items.length}!</div>
      <div class="qz-stars" aria-label="${stars} stars">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
      <div>${pct===1?"Perfect! You're a superstar!":pct>=.6?"Great job! Try again for 3 stars.":"Good try! Read the chapter once more and try again."}</div>
      <button type="button" class="qz-again">🔁 Try again</button>`;
    score.querySelector(".qz-again").addEventListener("click",()=>{
      const fresh=qb.cloneNode(true);qb.replaceWith(fresh);
      fresh.querySelectorAll(".qz").forEach(q=>{q.className="qz";q.querySelectorAll(".qz-opt").forEach(b=>{b.disabled=false;b.classList.remove("right","wrong")});const w=q.querySelector(".qz-why");if(w)w.hidden=true;const i=q.querySelector("input");if(i){i.value="";i.disabled=false;q.querySelector(".qz-check").disabled=false}});
      const sc=fresh.querySelector(".qz-score");sc.hidden=true;sc.innerHTML="";
      bindQuiz(fresh,id);
    });
    const side=document.querySelector(`.side a[aria-current="page"] .stars`);if(side)side.textContent="⭐".repeat(getStars(id));
  };
  items.forEach(qz=>{
    const opts=qz.querySelectorAll(".qz-opt");
    opts.forEach(b=>b.addEventListener("click",()=>{
      const ok=b.dataset.ok==="1";
      opts.forEach(o=>{o.disabled=true;if(o.dataset.ok==="1")o.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      finish(qz,ok);
    }));
    const input=qz.querySelector("input"),check=qz.querySelector(".qz-check");
    if(input){
      const go=()=>{
        if(!input.value.trim())return;
        const answers=input.dataset.answers.split(";").map(normAns),ok=answers.includes(normAns(input.value));
        input.disabled=true;check.disabled=true;
        if(!ok){const w=qz.querySelector(".qz-why"),p=document.createElement("p");p.className="qz-why";p.textContent="✔ Answer: "+input.dataset.answers.split(";")[0];qz.insertBefore(p,w||null)}
        finish(qz,ok);
      };
      check.addEventListener("click",go);
      input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();go()}});
    }
  });
}
async function showBook(el,g,k,n){
  try{
    const ch=await loadBook(g.id,k);
    if(!ch[n])throw new Error("no chapter");
    el.innerHTML=bookHTML(ch[n]);
    el.querySelectorAll(".book-quiz").forEach(qb=>bindQuiz(qb,`${g.id}/${k}/${n}`));
  }catch(e){
    el.innerHTML=`<p class="book-empty">This chapter's book is coming soon. You can still ask Mantra Buddy about it below!</p>`;
    return;
  }
  // Listen to one section at a time, with the same tutor voice and highlight as answers.
  if(!TTS&&!tutorVoice)return;
  el.querySelectorAll(".book-sec").forEach(sec=>{
    const b=sec.querySelector(".say"),label="🔊 Listen";
    b.hidden=false;
    const idle=()=>{b.textContent=label;b.setAttribute("aria-pressed","false")};
    b.addEventListener("click",()=>{
      if(b.getAttribute("aria-pressed")==="true"){stopSpeaking();return}
      stopSpeaking();
      b.textContent="⏳ Getting the voice…";b.setAttribute("aria-pressed","true");
      sec.querySelectorAll(".w").forEach(w=>w.replaceWith(w.textContent));
      sec.normalize();
      readAloud(prepareReading(sec),idle,()=>{b.textContent="⏹ Stop"});
    });
  });
}

/* ---------- router: #/  #/class-3  #/class-3/maths  #/class-3/maths/4 ---------- */
function route(){
  stopSpeaking();
  const [gid,k,n]=location.hash.replace(/^#\/?/,"").split("/");
  const g=gradeById(gid);
  jump.value=g?g.id:"";
  if(!g)home();
  else if(k&&g.s[k]&&+n>=1&&+n<=g.s[k].length)chapterPage(g,k,+n);
  else gradePage(g,k);
  window.scrollTo(0,0);
}

addEventListener("hashchange",route);
