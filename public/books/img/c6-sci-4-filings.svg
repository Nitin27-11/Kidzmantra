  <text x="340" y="112" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">S</text>
  <text x="80" y="200" font-size="15" fill="#222" text-anchor="middle">Most filings stick here</text>
  <text x="440" y="200" font-size="15" fill="#222" text-anchor="middle">…and here (poles)</text>
  <text x="260" y="200" font-size="15" fill="#666" text-anchor="middle">very few in the middle</text>
</svg>
