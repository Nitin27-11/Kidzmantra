    <!-- filings bunched at the ends -->
    <path d="M95 70 l-14 -10 M90 82 l-18 -4 M88 96 l-20 0 M88 110 l-20 2 M90 124 l-18 6 M95 136 l-14 10 M104 64 l-6 -14 M104 142 l-6 14 M78 66 l-10 -12 M76 140 l-10 12 M70 90 l-14 -2 M70 118 l-14 4"/>
    <path d="M425 70 l14 -10 M430 82 l18 -4 M432 96 l20 0 M432 110 l20 2 M430 124 l18 6 M425 136 l14 10 M416 64 l6 -14 M416 142 l6 14 M442 66 l10 -12 M444 140 l10 12 M450 90 l14 -2 M450 118 l14 4"/>
