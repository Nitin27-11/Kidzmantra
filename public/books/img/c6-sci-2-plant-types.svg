<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="Arial, sans-serif">
  <rect width="700" height="300" fill="#fff"/>
  <rect y="240" width="700" height="14" fill="#c9a36b"/>
  <!-- (a) herb -->
  <g transform="translate(70 240)">
    <path d="M0 0 v-60 M0 -30 l-14 -14 M0 -45 l12 -12" stroke="#4cc48e" stroke-width="3" fill="none"/>
    <g fill="#4cc48e"><ellipse cx="-18" cy="-48" rx="10" ry="6"/><ellipse cx="16" cy="-60" rx="10" ry="6"/><ellipse cx="0" cy="-66" rx="7" ry="10"/><ellipse cx="-8" cy="-22" rx="9" ry="5"/><ellipse cx="9" cy="-28" rx="9" ry="5"/></g>
  </g>
  <!-- (b) shrub -->
  <g transform="translate(200 240)">
    <path d="M0 0 v-20 M0 -20 l-26 -40 M0 -20 l26 -44 M0 -20 l0 -56 M-6 -10 l-30 -30 M6 -10 l32 -26" stroke="#8b5a2b" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g fill="#2e9c6a"><circle cx="-30" cy="-68" r="18"/><circle cx="0" cy="-86" r="20"/><circle cx="30" cy="-72" r="18"/><circle cx="-38" cy="-44" r="14"/><circle cx="40" cy="-42" r="14"/></g>
    <g fill="#ff6b8a"><circle cx="-26" cy="-74" r="5"/><circle cx="8" cy="-92" r="5"/><circle cx="34" cy="-64" r="5"/></g>
  </g>
  <!-- (c) tree -->
  <g transform="translate(340 240)">
    <path d="M-12 0 q4 -60 4 -120 h16 q0 60 4 120z" fill="#8b5a2b"/>
    <g fill="#2e9c6a"><circle cx="0" cy="-160" r="44"/><circle cx="-42" cy="-130" r="30"/><circle cx="42" cy="-132" r="30"/><circle cx="-20" cy="-196" r="26"/><circle cx="24" cy="-194" r="26"/></g>
  </g>
  <!-- (d) climber on a stick -->
  <g transform="translate(480 240)">
    <rect x="-3" y="-190" width="6" height="190" fill="#a07a4a"/>
    <path d="M0 0 c-18 -20 18 -40 0 -60 c-18 -20 18 -40 0 -60 c-18 -20 18 -40 0 -60" stroke="#4cc48e" stroke-width="4" fill="none"/>
    <g fill="#4cc48e"><ellipse cx="-20" cy="-30" rx="12" ry="7"/><ellipse cx="20" cy="-75" rx="12" ry="7"/><ellipse cx="-20" cy="-110" rx="12" ry="7"/><ellipse cx="20" cy="-150" rx="12" ry="7"/></g>
  </g>
  <!-- (e) creeper -->
  <g transform="translate(560 236)">
    <path d="M0 0 q30 -6 60 0 q30 6 70 -2" stroke="#4cc48e" stroke-width="4" fill="none"/>
    <g fill="#4cc48e"><path d="M20 -2 q-6 -22 10 -26 q10 16 -10 26z"/><path d="M70 0 q-4 -24 14 -26 q6 18 -14 26z"/><path d="M115 -2 q-6 -22 10 -24 q8 14 -10 24z"/></g>
    <ellipse cx="45" cy="-10" rx="18" ry="13" fill="#f39c34"/><path d="M45 -23 v-6" stroke="#2e9c6a" stroke-width="3"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#222">
    <text x="70" y="280">(a) Herb</text><text x="200" y="280">(b) Shrub</text><text x="340" y="280">(c) Tree</text><text x="480" y="280">(d) Climber</text><text x="625" y="280">(e) Creeper</text>
  </g>
