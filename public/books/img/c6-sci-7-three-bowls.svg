<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" font-family="Arial, sans-serif">
  <rect width="680" height="260" fill="#fff"/>
  <defs><g id="bowl"><path d="M-80 0 q0 70 80 70 q80 0 80 -70z" fill="none" stroke="#8a97a4" stroke-width="3"/></g></defs>
  <g transform="translate(110 120)"><path d="M-74 6 q4 58 74 58 q70 0 74 -58z" fill="#9fd3f5"/><use href="#bowl"/>
    <rect x="-40" y="0" width="22" height="18" rx="4" fill="#fff" stroke="#9fc6e8" stroke-width="2"/><rect x="10" y="4" width="20" height="16" rx="4" fill="#fff" stroke="#9fc6e8" stroke-width="2"/></g>
  <g transform="translate(340 120)"><path d="M-74 6 q4 58 74 58 q70 0 74 -58z" fill="#cfe6f5"/><use href="#bowl"/></g>
  <g transform="translate(570 120)"><path d="M-74 6 q4 58 74 58 q70 0 74 -58z" fill="#f7c6b4"/><use href="#bowl"/>
    <g stroke="#e07a5f" stroke-width="2" fill="none"><path d="M-20 -6 q-8 -12 0 -24 q8 -12 0 -24 M20 -6 q-8 -12 0 -24 q8 -12 0 -24"/></g></g>
  <g font-size="16" text-anchor="middle" font-weight="bold"><text x="110" y="220" fill="#244c9e">Cold water</text><text x="340" y="220" fill="#555">Room-temperature water</text><text x="570" y="220" fill="#c0392b">Lukewarm water</text></g>
  <g font-size="13" text-anchor="middle" fill="#555"><text x="110" y="240">left hand first</text><text x="340" y="240">then both hands</text><text x="570" y="240">right hand first</text></g>
  <g font-size="13" fill="#222" text-anchor="middle"><text x="250" y="40">left hand: "feels warm!"</text><text x="430" y="40">right hand: "feels cool!"</text></g>
  <text x="110" y="60" font-size="34" text-anchor="middle">🤚</text><text x="570" y="60" font-size="34" text-anchor="middle">✋</text><text x="340" y="80" font-size="30" text-anchor="middle">🤚✋</text>
</svg>
