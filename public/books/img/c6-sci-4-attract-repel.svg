<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#222"/></marker></defs>
  <rect width="560" height="300" fill="#fff"/>
  <g font-weight="bold" font-size="16" fill="#fff" text-anchor="middle">
    <!-- row 1: N S | N S attract -->
    <rect x="40" y="30" width="60" height="30" fill="#e04848"/><rect x="100" y="30" width="60" height="30" fill="#3a6fd8"/><text x="70" y="51">N</text><text x="130" y="51">S</text>
    <rect x="240" y="30" width="60" height="30" fill="#e04848"/><rect x="300" y="30" width="60" height="30" fill="#3a6fd8"/><text x="270" y="51">N</text><text x="330" y="51">S</text>
    <!-- row 2: N S | S N repel -->
    <rect x="40" y="130" width="60" height="30" fill="#e04848"/><rect x="100" y="130" width="60" height="30" fill="#3a6fd8"/><text x="70" y="151">N</text><text x="130" y="151">S</text>
    <rect x="210" y="130" width="60" height="30" fill="#3a6fd8"/><rect x="270" y="130" width="60" height="30" fill="#e04848"/><text x="240" y="151">S</text><text x="300" y="151">N</text>
    <!-- row 3: S N | N S repel -->
    <rect x="40" y="230" width="60" height="30" fill="#3a6fd8"/><rect x="100" y="230" width="60" height="30" fill="#e04848"/><text x="70" y="251">S</text><text x="130" y="251">N</text>
    <rect x="210" y="230" width="60" height="30" fill="#e04848"/><rect x="270" y="230" width="60" height="30" fill="#3a6fd8"/><text x="240" y="251">N</text><text x="300" y="251">S</text>
  </g>
  <g stroke="#222" stroke-width="2.5" fill="none">
    <path d="M166 45 h26" marker-end="url(#a)"/><path d="M234 45 h-26" marker-end="url(#a)"/>
    <path d="M185 145 h-22" marker-end="url(#a)"/><path d="M188 145 h20" marker-end="url(#a)"/>
    <path d="M185 245 h-22" marker-end="url(#a)"/><path d="M188 245 h20" marker-end="url(#a)"/>
  </g>
  <g font-size="16" fill="#222">
    <text x="380" y="50">Unlike poles (S–N): <tspan font-weight="bold" fill="#1d8a4e">attract</tspan></text>
    <text x="380" y="150">Like poles (S–S): <tspan font-weight="bold" fill="#c0392b">repel</tspan></text>
    <text x="380" y="250">Like poles (N–N): <tspan font-weight="bold" fill="#c0392b">repel</tspan></text>
  </g>
</svg>
