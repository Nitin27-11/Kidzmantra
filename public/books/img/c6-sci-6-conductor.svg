<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280" font-family="Arial, sans-serif">
  <rect width="560" height="280" fill="#fff"/>
  <!-- flame -->
  <g transform="translate(200 230)"><path d="M-40 0 q10 -40 20 -20 q6 -40 20 -30 q14 -10 20 30 q10 -20 20 20z" fill="#ff8a3d"/><path d="M-20 0 q6 -24 12 -10 q4 -24 12 -16 q8 6 12 26z" fill="#ffd34d"/></g>
  <rect x="120" y="226" width="160" height="12" rx="4" fill="#555"/>
  <!-- pan -->
  <path d="M90 150 h220 l-14 60 h-192z" fill="#9aa7b4" stroke="#5a6672" stroke-width="3"/>
  <rect x="300" y="160" width="190" height="22" rx="11" fill="#2b2b2b"/>
  <g stroke="#e04848" stroke-width="2" fill="none" opacity=".8"><path d="M150 140 q-8 -14 0 -28 q8 -14 0 -28 M200 140 q-8 -14 0 -28 q8 -14 0 -28 M250 140 q-8 -14 0 -28 q8 -14 0 -28"/></g>
  <g font-size="14" fill="#222">
    <text x="60" y="40">Metal pan: a good conductor –</text><text x="60" y="58">heat passes through it to the food</text>
