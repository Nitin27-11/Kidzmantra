  <path d="M470 150 q-30 -10 -36 -30 q24 2 36 30z M470 120 q30 -8 36 -28 q-24 2 -36 28z M470 90 q-22 -8 -24 -26 q18 4 24 26z" fill="#4cc48e"/>
