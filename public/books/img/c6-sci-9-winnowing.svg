<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="Arial, sans-serif">
  <rect width="680" height="320" fill="#eaf5ff"/>
  <rect y="280" width="680" height="40" fill="#e8d3a6"/>
  <!-- platform -->
  <rect x="80" y="180" width="140" height="100" fill="#b8874a" stroke="#8a6030" stroke-width="3"/>
  <!-- farmer simple -->
  <g transform="translate(150 70)">
    <circle cx="0" cy="0" r="18" fill="#b57a4c"/><path d="M-18 -6 q18 -22 36 0" fill="#fff"/>
    <path d="M-22 22 h44 l6 58 h-56z" fill="#f5f5f5" stroke="#ccc"/>
    <path d="M-24 80 h48 v30 h-48z" fill="#fff" stroke="#ccc"/>
    <path d="M20 30 l40 10" stroke="#b57a4c" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- basket -->
  <path d="M200 100 q40 30 90 10 l-10 -20 q-40 14 -70 -6z" fill="#d9a441" stroke="#8a6030" stroke-width="2"/>
  <!-- falling grain -->
  <g fill="#c99a12"><circle cx="270" cy="140" r="3"/><circle cx="274" cy="165" r="3"/><circle cx="268" cy="190" r="3"/><circle cx="272" cy="215" r="3"/><circle cx="266" cy="240" r="3"/><circle cx="276" cy="255" r="3"/></g>
  <path d="M240 280 q30 -26 60 0z" fill="#e0b13a"/>
  <!-- husk blowing -->
  <g fill="#c9b98a"><ellipse cx="320" cy="150" rx="5" ry="2"/><ellipse cx="370" cy="175" rx="5" ry="2"/><ellipse cx="420" cy="200" rx="5" ry="2"/><ellipse cx="470" cy="220" rx="5" ry="2"/><ellipse cx="510" cy="245" rx="5" ry="2"/><ellipse cx="400" cy="160" rx="5" ry="2"/><ellipse cx="450" cy="190" rx="5" ry="2"/></g>
  <path d="M470 280 q50 -24 100 0z" fill="#d6c79a"/>
  <!-- wind -->
  <g stroke="#7aa8c8" stroke-width="3" fill="none" stroke-linecap="round"><path d="M20 30 q30 -10 60 0 t60 0"/><path d="M320 60 q30 -10 60 0 t60 0"/><path d="M420 100 q30 -10 60 0"/></g>
  <path d="M490 100 l12 0 l-6 -6 M502 100 l-6 6" stroke="#7aa8c8" stroke-width="3" fill="none"/>
  <g font-size="15" fill="#222" text-anchor="middle"><text x="270" y="305">heavy grain</text><text x="520" y="305">light husk</text><text x="380" y="40">wind</text></g>
</svg>
