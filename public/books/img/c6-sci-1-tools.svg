<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="Arial, sans-serif">
  <rect width="640" height="250" fill="#fff"/>
  <!-- (a) hand lens -->
  <g transform="translate(70 105)">
    <circle r="42" fill="#dff2ff" stroke="#333" stroke-width="6"/>
    <path d="M-20 -22 q10 -10 24 -8" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="26" y="26" width="16" height="62" rx="6" transform="rotate(-45 34 57)" fill="#8b5a2b"/>
  </g>
  <!-- (b) thermometer -->
  <g transform="translate(200 30)">
    <rect x="-9" y="0" width="18" height="140" rx="9" fill="#fff" stroke="#333" stroke-width="3"/>
    <circle cy="152" r="17" fill="#e04848" stroke="#333" stroke-width="3"/>
    <rect x="-4" y="60" width="8" height="92" fill="#e04848"/>
    <g stroke="#333" stroke-width="2"><path d="M9 20h8M9 40h8M9 60h8M9 80h8M9 100h8M9 120h8"/></g>
  </g>
  <!-- (c) measuring cylinder -->
  <g transform="translate(320 30)">
    <path d="M-28 0 h56 M-24 0 v150 h48 v-150" fill="none" stroke="#333" stroke-width="3"/>
    <rect x="-24" y="80" width="48" height="70" fill="#9fd3f5"/>
    <path d="M-24 0 v150 h48 v-150" fill="none" stroke="#333" stroke-width="3"/>
    <rect x="-40" y="150" width="80" height="10" rx="3" fill="#555"/>
    <g stroke="#333" stroke-width="2"><path d="M-24 20h12M-24 50h12M-24 80h12M-24 110h12M-24 140h12"/></g>
  </g>
  <!-- (d) scale -->
  <g transform="translate(385 85) scale(.8)">
    <rect width="150" height="34" fill="#ffe08a" stroke="#333" stroke-width="3"/>
    <g stroke="#333" stroke-width="2"><path d="M10 0v14M25 0v8M40 0v14M55 0v8M70 0v14M85 0v8M100 0v14M115 0v8M130 0v14"/></g>
    <g font-size="10" text-anchor="middle" fill="#333"><text x="10" y="28">0</text><text x="40" y="28">2</text><text x="70" y="28">4</text><text x="100" y="28">6</text><text x="130" y="28">8</text></g>
  </g>
  <!-- (e) stopwatch -->
  <g transform="translate(590 112)">
    <rect x="-8" y="-58" width="16" height="12" rx="3" fill="#555"/>
    <circle r="44" fill="#fff" stroke="#333" stroke-width="5"/>
    <g stroke="#333" stroke-width="2"><path d="M0 -38v8M38 0h-8M0 38v-8M-38 0h8"/></g>
    <path d="M0 0 L0 -30" stroke="#e04848" stroke-width="3"/><path d="M0 0 L18 10" stroke="#333" stroke-width="3"/>
    <circle r="4" fill="#333"/>
  </g>
  <g font-size="16" text-anchor="middle" fill="#222">
    <text x="70" y="232">(a)</text><text x="200" y="232">(b)</text><text x="320" y="232">(c)</text><text x="445" y="232">(d)</text><text x="590" y="232">(e)</text>
  </g>
</svg>
