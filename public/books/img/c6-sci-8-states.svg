<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270" font-family="Arial, sans-serif">
  <rect width="680" height="270" fill="#fff"/>
  <!-- ice cubes -->
  <g transform="translate(110 150)">
    <path d="M-60 -10 l30 -20 h50 l-30 20z" fill="#e8f7ff" stroke="#7aa8c8" stroke-width="2"/><rect x="-60" y="-10" width="50" height="50" fill="#d4efff" stroke="#7aa8c8" stroke-width="2"/><path d="M-10 -10 l30 -20 v50 l-30 20z" fill="#bfe4fb" stroke="#7aa8c8" stroke-width="2"/>
    <path d="M0 10 l26 -18 h40 l-26 18z" fill="#e8f7ff" stroke="#7aa8c8" stroke-width="2"/><rect x="0" y="10" width="40" height="40" fill="#d4efff" stroke="#7aa8c8" stroke-width="2"/><path d="M40 10 l26 -18 v40 l-26 18z" fill="#bfe4fb" stroke="#7aa8c8" stroke-width="2"/>
    <path d="M-50 0 l14 -6" stroke="#fff" stroke-width="3"/>
  </g>
  <!-- glass of water -->
  <g transform="translate(340 60)">
    <path d="M-50 0 l8 150 h84 l8 -150" fill="#eef8ff" stroke="#7aa8c8" stroke-width="4"/>
    <path d="M-47 50 l5 100 h84 l5 -100z" fill="#9fd3f5"/>
  </g>
  <!-- kettle with vapour -->
  <g transform="translate(545 150)">
    <path d="M-50 60 q-6 -60 50 -64 q56 4 50 64z" fill="#c0c7cf" stroke="#5a6672" stroke-width="3"/>
    <path d="M44 20 l40 -30 l6 6 l-34 38z" fill="#c0c7cf" stroke="#5a6672" stroke-width="3"/>
    <rect x="-14" y="-10" width="28" height="8" rx="3" fill="#5a6672"/>
    <path d="M-36 0 q36 -50 72 0" stroke="#5a6672" stroke-width="5" fill="none"/>
    <g fill="none" stroke="#9fb3c6" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round"><path d="M92 -16 q14 -20 0 -40 q-14 -20 0 -40"/><path d="M108 -12 q14 -20 0 -40 q-14 -20 0 -40"/></g>
    <text x="70" y="-104" font-size="12" text-anchor="middle" fill="#555">invisible vapour</text>
  </g>
  <g font-size="15" text-anchor="middle" fill="#222"><text x="110" y="240">(a) Solid – ice</text><text x="340" y="240">(b) Liquid – water</text><text x="570" y="240">(c) Gas – water vapour</text></g>
  <g font-size="12" text-anchor="middle" fill="#555"><text x="110" y="258">fixed shape</text><text x="340" y="258">takes the shape of the container</text><text x="570" y="258">spreads everywhere</text></g>
</svg>
