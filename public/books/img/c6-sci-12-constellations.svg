<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="Arial, sans-serif">
  <rect width="720" height="300" fill="#141a33"/>
  <g fill="#fff" opacity=".35"><circle cx="40" cy="30" r="1"/><circle cx="250" cy="60" r="1"/><circle cx="420" cy="20" r="1"/><circle cx="600" cy="270" r="1"/><circle cx="330" cy="250" r="1"/><circle cx="700" cy="80" r="1"/></g>
  <!-- (a) Saptarishi + pole star -->
  <g stroke="#6aaeea" stroke-width="1.5" fill="none" opacity=".8"><path d="M40 200 L80 180 L120 185 L150 200 L160 240 L215 245 L222 200 L150 200"/><path d="M150 200 L222 200" stroke="none"/></g>
  <g fill="#fff"><circle cx="40" cy="200" r="4"/><circle cx="80" cy="180" r="4"/><circle cx="120" cy="185" r="4"/><circle cx="150" cy="200" r="4"/><circle cx="160" cy="240" r="4"/><circle cx="215" cy="245" r="4"/><circle cx="222" cy="200" r="4"/></g>
  <path d="M215 245 L244 62" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="5 5"/>
  <circle cx="245" cy="55" r="6" fill="#ffd166"/>
  <text x="257" y="60" font-size="13" fill="#ffd166">Pole Star</text>
  <text x="232" y="230" font-size="11" fill="#9fb3c6">pointer stars</text>
  <!-- (b) Orion -->
  <g transform="translate(420 0)">
    <g stroke="#6aaeea" stroke-width="1.5" fill="none" opacity=".8"><path d="M-40 70 L-14 140 L14 140 L40 70 M-14 140 L-30 220 M14 140 L34 220 M-14 140 L0 136 L14 140"/></g>
    <g fill="#fff"><circle cx="-40" cy="70" r="5" fill="#ffb37a"/><circle cx="40" cy="70" r="4"/><circle cx="-14" cy="140" r="4"/><circle cx="0" cy="136" r="4"/><circle cx="14" cy="140" r="4"/><circle cx="-30" cy="220" r="4"/><circle cx="34" cy="220" r="5" fill="#bcd7ff"/></g>
    <text x="30" y="150" font-size="11" fill="#9fb3c6">belt</text>
  </g>
  <!-- (c) Cassiopeia -->
  <g transform="translate(600 120)">
    <g stroke="#6aaeea" stroke-width="1.5" fill="none" opacity=".8"><path d="M-60 0 L-30 40 L0 10 L30 40 L60 0"/></g>
    <g fill="#fff"><circle cx="-60" cy="0" r="4"/><circle cx="-30" cy="40" r="4"/><circle cx="0" cy="10" r="4"/><circle cx="30" cy="40" r="4"/><circle cx="60" cy="0" r="4"/></g>
  </g>
  <g font-size="15" text-anchor="middle" fill="#fff"><text x="130" y="285">(a) Saptarishi and the Pole Star</text><text x="420" y="285">(b) Orion</text><text x="600" y="285">(c) Cassiopeia</text></g>
</svg>
