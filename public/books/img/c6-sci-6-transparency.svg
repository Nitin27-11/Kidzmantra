<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="Arial, sans-serif">
  <rect width="720" height="260" fill="#fff"/>
  <defs><g id="torch"><rect x="-40" y="-14" width="56" height="28" rx="6" fill="#555"/><path d="M16 -20 h14 v40 h-14z" fill="#777"/><circle cx="30" cy="0" r="10" fill="#ffe680"/></g></defs>
  <!-- (a) glass -->
  <g transform="translate(120 110)">
    <use href="#torch" x="-60"/>
    <path d="M-20 0 L60 -30 V30 Z" fill="#fff3a0" opacity=".7"/>
    <rect x="0" y="-70" width="18" height="140" fill="#cfefff" stroke="#7aa8c8" stroke-width="2" opacity=".8"/>
    <path d="M18 -26 L100 -46 V46 L18 26Z" fill="#fff3a0" opacity=".9"/>
    <text x="70" y="0" font-size="26" text-anchor="middle">👁️</text>
  </g>
  <!-- (b) butter paper -->
  <g transform="translate(360 110)">
    <use href="#torch" x="-60"/>
    <path d="M-20 0 L60 -30 V30 Z" fill="#fff3a0" opacity=".7"/>
    <rect x="0" y="-70" width="18" height="140" fill="#f4efe0" stroke="#c9bf9a" stroke-width="2" opacity=".9"/>
    <path d="M18 -20 L100 -34 V34 L18 20Z" fill="#fff3a0" opacity=".4"/>
    <text x="70" y="0" font-size="26" text-anchor="middle">👁️</text>
  </g>
  <!-- (c) cardboard -->
  <g transform="translate(600 110)">
    <use href="#torch" x="-60"/>
    <path d="M-20 0 L0 -10 V10 Z" fill="#fff3a0" opacity=".7"/>
    <rect x="0" y="-70" width="18" height="140" fill="#b8874a" stroke="#8a6030" stroke-width="2"/>
    <text x="70" y="0" font-size="26" text-anchor="middle">👁️</text>
  </g>
  <g font-size="15" text-anchor="middle" fill="#222">
    <text x="120" y="215">(a) Clear glass</text><text x="120" y="235" font-size="13" fill="#2e9c6a">transparent – torch seen clearly</text>
    <text x="360" y="215">(b) Butter paper</text><text x="360" y="235" font-size="13" fill="#c98a12">translucent – seen partly</text>
    <text x="600" y="215">(c) Cardboard</text><text x="600" y="235" font-size="13" fill="#e04848">opaque – not seen at all</text>
  </g>
</svg>
