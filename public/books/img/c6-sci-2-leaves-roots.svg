<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" font-family="Arial, sans-serif">
  <rect width="620" height="360" fill="#fff"/>
  <rect y="190" width="620" height="140" fill="#f1dfbd"/>
  <!-- (a) reticulate leaf + taproot -->
  <g transform="translate(160 0)">
    <path d="M0 190 v-60" stroke="#2e9c6a" stroke-width="4"/>
    <path d="M0 130 q-70 -40 0 -120 q70 80 0 120z" fill="#7ad39d" stroke="#2e9c6a" stroke-width="3"/>
    <path d="M0 128 V16" stroke="#1d6b48" stroke-width="3"/>
    <g stroke="#1d6b48" stroke-width="1.6" fill="none">
      <path d="M0 110 l-30 -16 M0 90 l-32 -18 M0 70 l-28 -18 M0 50 l-20 -14 M0 110 l30 -16 M0 90 l32 -18 M0 70 l28 -18 M0 50 l20 -14"/>
      <path d="M-15 102 l6 -12 M-18 82 l6 -12 M-14 62 l5 -10 M15 102 l-6 -12 M18 82 l-6 -12 M14 62 l-5 -10 M-22 96 l-8 -6 M22 96 l8 -6"/>
    </g>
    <path d="M0 190 q2 60 0 120" stroke="#a0703a" stroke-width="9" fill="none" stroke-linecap="round"/>
    <g stroke="#a0703a" stroke-width="3" fill="none"><path d="M0 210 l-30 18 M0 225 l28 16 M0 245 l-34 20 M0 262 l30 18 M0 280 l-22 16"/></g>
  </g>
  <!-- (b) parallel leaf + fibrous -->
  <g transform="translate(460 0)">
    <path d="M0 190 v-40" stroke="#2e9c6a" stroke-width="4"/>
    <path d="M-14 150 q-6 -80 14 -140 q20 60 14 140z" fill="#7ad39d" stroke="#2e9c6a" stroke-width="3"/>
    <g stroke="#1d6b48" stroke-width="1.6" fill="none"><path d="M0 148 V18 M-7 148 q-3 -70 5 -124 M7 148 q3 -70 -5 -124 M-11 146 q-4 -50 3 -100 M11 146 q4 -50 -3 -100"/></g>
    <g stroke="#a0703a" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M0 190 q-30 40 -44 100 M0 190 q-16 50 -20 110 M0 190 q0 50 2 112 M0 190 q16 50 22 108 M0 190 q30 40 46 96 M0 190 q-40 30 -60 70 M0 190 q40 30 62 66"/>
    </g>
  </g>
  <line x1="310" y1="20" x2="310" y2="320" stroke="#ddd" stroke-width="2"/>
  <g font-size="15" text-anchor="middle" fill="#222">
    <text x="160" y="348">(a) Reticulate venation + taproot</text>
    <text x="460" y="348">(b) Parallel venation + fibrous roots</text>
  </g>
  <g font-size="12" fill="#555"><text x="200" y="60">net-like veins</text><text x="40" y="250">main root</text><text x="500" y="60">veins side by side</text><text x="520" y="250">many thin roots</text></g>
</svg>
